# Local infrastructure. Start with: npm run infra:up
# (--wait makes it return only once every service with a healthcheck is healthy)
# Passwords here are throwaway values for your laptop only.
services:
  postgres:
    image: postgres:17
    # More connections and memory than the defaults (100 connections, 128MB), for the
    # stress tests, which run several API, relay and worker processes at once.
    # Durability settings stay at their safe defaults: every commit is written to disk.
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB"]
    shm_size: 256mb # Docker's default 64MB is too small for big parallel queries
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the extra relay_test database used by integration tests
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -h localhost: during first-time setup Postgres only listens on a local socket,
      # so checking over TCP waits until the real server is up.
      test: ["CMD-SHELL", "pg_isready -h localhost -U relay -d relay"]
      interval: 5s
      retries: 10

  # Used from step 3: the job queue between the outbox relay and the email worker
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: relay
      RABBITMQ_DEFAULT_PASS: relay
    ports:
      - "5672:5672"   # AMQP (apps connect here)
      - "15672:15672" # Management UI: http://localhost:15672 (relay / relay)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # Used from step 5: rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Fake email server: catches every email so nothing reaches a real inbox
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP (the worker sends here)
      - "8025:8025" # Web inbox: http://localhost:8025

  # Load testing tool. Only runs when asked: npm run load:test
  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    network_mode: host # so k6 can reach the API at localhost:3000
    volumes:
      - ./load:/load:ro
    environment:
      SCENARIO: ${SCENARIO:-steady}
      RATE: ${RATE:-100}
      DURATION: ${DURATION:-30s}
      BASE_RATE: ${BASE_RATE:-200}
      PEAK_RATE: ${PEAK_RATE:-2000}
      API_URL: ${API_URL:-http://localhost:3000}
    command: ["run", "--quiet", "/load/send-emails.js"]

volumes:
  postgres-data:
