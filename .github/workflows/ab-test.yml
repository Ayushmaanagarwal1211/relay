name: A/B stress test (temporary)

on:
  push:
    branches: ["perf/*"]

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgres://relay:relay@localhost:5432/relay
      RABBITMQ_URL: amqp://relay:relay@localhost:5672
      REDIS_URL: redis://localhost:6379
      RATE: "800"
      DURATION: 1m
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && cp .env.example .env && docker compose version
      - name: A, B, A, B
        run: |
          for round in 1 2; do
            for net in false true; do
              echo "### Round $round: host network = $net" >> "$GITHUB_STEP_SUMMARY"
              STRESS_HOST_NETWORK=$net npm run stress -- steady > "run.log" 2>&1 || { tail -40 run.log; exit 1; }
              grep -E "^\*\*|^Machine|^\| (Requests|Latency|Requests k6|Delivery throughput|End-to-end|Most)|busy|docker-proxy|Kernel" run.log | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
