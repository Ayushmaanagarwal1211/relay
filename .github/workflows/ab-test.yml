name: A/B stress test (temporary)

# Runs the old and new API code alternately on the SAME machine, so hardware differences
# between GitHub runners can't skew the comparison.
on:
  push:
    branches: ["perf/*"]

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgres://relay:relay@localhost:5432/relay
      RABBITMQ_URL: amqp://relay:relay@localhost:5672
      REDIS_URL: redis://localhost:6379
      RATE: "800"
      DURATION: 1m
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && cp .env.example .env
      - name: A, B, A, B
        run: |
          for round in 1 2; do
            for version in old new; do
              if [ "$version" = old ]; then git checkout -q origin/main -- src/api/emails.service.ts; else git checkout -q HEAD -- src/api/emails.service.ts; fi
              echo "### Round $round: $version code" >> "$GITHUB_STEP_SUMMARY"
              npm run stress -- steady > "run-$round-$version.log" 2>&1 || true
              grep -E "^\*\*|^Machine|^\| (Requests|Latency|Requests k6)" "run-$round-$version.log" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
